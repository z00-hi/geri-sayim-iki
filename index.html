<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf2f8">
<title>EzgiŞ geliyor ✈️</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  crossorigin=""
>

<style>
:root {
  --panel-a:#d7eef9;
  --panel-b:#e9e5fb;
  --panel-c:#f6e4ee;
  --panel-d:#ffe7d9;

  --ink:#18263f;
  --muted:#6e7c93;

  --purple:#8654e7;
  --violet:#a45de1;
  --pink:#d266c5;
  --coral:#ff8a6f;
  --cyan:#59d9f1;
  --gold:#ffd45e;

  --route:#25c65a;
  --passed:#8f52ea;

  --panel-shadow:0 8px 28px rgba(31,51,84,.15);
}

* {
  box-sizing:border-box;
}

html,
body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body {
  position:relative;
  font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:#edf3f8;
  -webkit-font-smoothing:antialiased;
}

button,
input,
select,
textarea {
  font:inherit;
}

/* =========================================================
   ÜST PANEL
   ========================================================= */
.dashboard {
  position:fixed;
  z-index:1000;
  top:0;
  left:0;
  right:0;
  width:100%;
  background:
    linear-gradient(
      105deg,
      rgba(215,238,249,.94) 0%,
      rgba(233,229,251,.94) 42%,
      rgba(246,228,238,.94) 72%,
      rgba(255,231,217,.94) 100%
    );
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(24,52,95,.08);
  box-shadow:0 7px 22px rgba(31,51,84,.11);
}

.dashboard-inner {
  width:min(1120px,100%);
  margin:0 auto;
  display:grid;
  grid-template-columns:164px minmax(0,1fr);
  gap:18px;
  align-items:stretch;
  padding:7px 22px 9px;
}

.hourglass-zone {
  min-height:154px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.content-zone {
  position:relative;
  min-width:0;
  display:grid;
  grid-template-rows:auto auto;
  align-content:center;
  row-gap:12px;
  overflow:hidden;
  isolation:isolate;
  padding-left:18px;
}

.content-zone::before {
  content:"✈️";
  position:absolute;
  z-index:0;
  left:51%;
  top:50%;
  transform:translate(-50%,-50%) rotate(-10deg);
  font-size:clamp(235px,23vw,330px);
  line-height:1;
  opacity:.034;
  filter:grayscale(.2) saturate(.75);
  pointer-events:none;
  user-select:none;
}

.content-zone > * {
  position:relative;
  z-index:1;
}


.dashboard-head {
  width:100%;
  margin:0;
  display:block;
  padding:0;
}

/* =========================================================
   TEK ANALOG SAAT
   ========================================================= */
.clock-wrap {
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:11px;
  min-width:0;
  justify-self:end;
}

.analog-clock {
  width:72px;
  height:72px;
  flex:0 0 72px;
  position:relative;
  border-radius:50%;
  background:
    linear-gradient(
      135deg,
      #7d4dff 0%,
      #5ddcff 34%,
      #ff72cd 68%,
      #ffd55d 100%
    );
  filter:drop-shadow(0 5px 9px rgba(24,41,72,.16));
}

.analog-clock::after {
  content:"";
  position:absolute;
  inset:6px;
  border-radius:50%;
  background:#fff;
  box-shadow:
    inset 0 0 0 1px rgba(23,52,95,.07),
    inset 0 0 10px rgba(43,66,104,.035);
}

.clock-face {
  position:absolute;
  z-index:10;
  inset:9px;
  border-radius:50%;
  pointer-events:none;
}

.tick {
  position:absolute;
  left:50%;
  top:50%;
  width:1.6px;
  height:4.5px;
  margin-left:-.8px;
  margin-top:-25px;
  transform-origin:.8px 25px;
  background:#8492a8;
  border-radius:99px;
  opacity:.65;
}

.tick.major {
  width:2.6px;
  height:7px;
  margin-left:-1.3px;
  transform-origin:1.3px 25px;
  background:#334864;
  opacity:.9;
}

.hand {
  position:absolute;
  z-index:20;
  left:50%;
  top:50%;
  transform-origin:2px 50%;
  border-radius:99px;
}

.hand.hour {
  width:14px;
  height:3.6px;
  margin-left:-2px;
  margin-top:-2px;
  background:#273a58;
}

.hand.minute {
  width:19px;
  height:2.7px;
  margin-left:-2px;
  margin-top:-1.5px;
  background:#405a7f;
}

.hand.second {
  width:18px;
  height:1.3px;
  margin-left:-2px;
  margin-top:-.75px;
  background:#d94f6a;
}

.clock-pin {
  position:absolute;
  z-index:30;
  left:50%;
  top:50%;
  width:5px;
  height:5px;
  margin:-2.5px 0 0 -2.5px;
  border-radius:50%;
  background:#fff;
  border:1.4px solid #334864;
}

.clock-caption {
  min-width:0;
  text-align:right;
}

.clock-caption .small {
  font-size:11px;
  line-height:1.15;
  font-weight:900;
  letter-spacing:.65px;
  color:#243854;
  white-space:nowrap;
}

.clock-caption .time {
  margin-top:5px;
  font-size:27px;
  line-height:1.08;
  font-weight:950;
  color:#111;
  letter-spacing:-.4px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

/* =========================================================
   BAŞLIK
   ========================================================= */
.title-stack {
  min-width:0;
  width:auto;
  max-width:100%;
  min-height:0;
  margin:0;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  text-align:left;
  overflow:visible;
  background:transparent;
  border:none;
  box-shadow:none;
}

.title {
  display:inline-block;
  margin:0;
  padding:.08em 0 .20em;
  overflow:visible;
  font-size:clamp(36px,4vw,50px);
  line-height:1.16;
  font-weight:950;
  letter-spacing:.1px;
  white-space:nowrap;
  background:linear-gradient(90deg,#7448e8 0%,#b85bd5 52%,#ef72a8 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
}


/* =========================================================
   GERİ SAYIM
   ========================================================= */
.countdown-row {
  width:100%;
  margin:0;
  display:block;
  padding:0;
}

.hourglass-wrap {
  position:relative;
  width:140px;
  height:146px;
  display:grid;
  place-items:center;
}

.hourglass-aura {
  position:absolute;
  width:118px;
  height:118px;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.98) 0%,
      rgba(255,205,245,.62) 28%,
      rgba(130,206,255,.30) 52%,
      rgba(147,93,237,.12) 68%,
      transparent 74%
    );
  animation:auraPulse 2.2s ease-in-out infinite;
}

.sparkles {
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
}

.sparkles span {
  position:absolute;
  color:#fff;
  text-shadow:
    0 0 5px #fff,
    0 0 12px #b778ff,
    0 0 18px #5edbff;
  animation:twinkle 1.7s ease-in-out infinite;
}

.sparkles span:nth-child(1) { left:1px; top:7px; font-size:15px; animation-delay:.1s; }
.sparkles span:nth-child(2) { right:2px; top:18px; font-size:12px; animation-delay:.5s; }
.sparkles span:nth-child(3) { left:5px; bottom:10px; font-size:11px; animation-delay:.9s; }
.sparkles span:nth-child(4) { right:5px; bottom:3px; font-size:15px; animation-delay:1.2s; }

@keyframes auraPulse {
  0%,100% { transform:scale(.92); opacity:.7; }
  50% { transform:scale(1.08); opacity:1; }
}

@keyframes twinkle {
  0%,100% { transform:scale(.65) rotate(0deg); opacity:.3; }
  50% { transform:scale(1.22) rotate(20deg); opacity:1; }
}

.hourglass {
  position:relative;
  z-index:2;
  width:112px;
  height:134px;
  filter:drop-shadow(0 7px 10px rgba(94,63,164,.24));
}

#topSand,
#bottomSand {
  transition:
    y .8s linear,
    height .8s linear,
    opacity .4s ease;
}

.sand-stream,
.grain {
  transition:opacity .35s ease;
}

.countdown-content {
  min-width:0;
  width:100%;
}


.count-grid {
  width:auto;
  display:grid;
  grid-template-columns:repeat(4,132px);
  justify-content:start;
  gap:14px;
}

.count-unit {
  background:rgba(255,255,255,.90);
  border:1px solid rgba(255,255,255,.66);
  border-radius:16px;
  padding:10px 7px 9px;
  text-align:center;
  box-shadow:0 4px 12px rgba(30,50,84,.055);
}

.count-value {
  font-size:27px;
  line-height:1;
  font-weight:900;
  color:#111;
  letter-spacing:-1px;
  font-variant-numeric:tabular-nums;
}

.count-label {
  margin-top:5px;
  font-size:10px;
  font-weight:750;
  color:#63718a;
}

/* =========================================================
   HARİTA
   ========================================================= */
#map {
  position:fixed;
  z-index:1;
  inset:0;
  width:100%;
  height:100%;
  background:#e9eff4;
}

.leaflet-control-attribution {
  font-size:8px!important;
  color:#66748a!important;
  background:rgba(255,255,255,.82)!important;
}

.route-tip {
  border:0!important;
  border-radius:9px!important;
  padding:5px 8px!important;
  background:rgba(255,255,255,.96)!important;
  box-shadow:0 5px 15px rgba(27,39,65,.15)!important;
  color:#263750!important;
  font-size:11px!important;
  font-weight:800!important;
}

.route-tip::before {
  display:none!important;
}

.custom-pin {
  background:transparent!important;
  border:0!important;
}

.pin-svg {
  overflow:visible;
  filter:drop-shadow(0 8px 12px rgba(57,36,99,.25));
}

.pin-pulse {
  transform-box:fill-box;
  transform-origin:center;
  animation:pinPulse 2s ease-out infinite;
}

@keyframes pinPulse {
  0% { opacity:.68; transform:scale(.92); }
  70% { opacity:0; transform:scale(1.16); }
  100% { opacity:0; transform:scale(1.16); }
}

.map-status {
  position:absolute;
  z-index:700;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  max-width:calc(100% - 40px);
  padding:8px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.92);
  border:1px solid rgba(24,52,95,.08);
  box-shadow:0 7px 22px rgba(30,50,85,.14);
  backdrop-filter:blur(9px);
  color:#536176;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.map-status strong {
  color:var(--purple);
}

/* =========================================================
   MOBİL

/* =========================================================
   YÜKLENEN SVG ROTA OVERLAY
   ========================================================= */
.route-art-overlay {
  position:absolute;
  left:0;
  top:0;
  pointer-events:none;
  overflow:visible;
  display:block;
}

.route-art-overlay path {
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}

.route-art-halo {
  stroke:#ffffff;
  stroke-width:7;
  opacity:.94;
}

.route-art-main {
  stroke:#25c65a;
  stroke-width:3.7;
  stroke-dasharray:14 10;
  opacity:1;
}


/* =========================================================
   SON 10 SANİYE / FİNAL ANİMASYONU
   ========================================================= */
.final-sequence {
  position:fixed;
  z-index:5000;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  opacity:0;
  visibility:hidden;
  transition:opacity .28s ease;
}

.final-sequence.is-active {
  opacity:1;
  visibility:visible;
}

.final-sequence::before {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(239,246,249,.18);
  backdrop-filter:blur(1.2px);
  -webkit-backdrop-filter:blur(1.2px);
}

.final-hourglass-stage {
  position:absolute;
  z-index:4;
  left:50%;
  top:50%;
  width:112px;
  height:134px;
  transform:translate(-50%,-50%);
  transform-origin:center;
  will-change:left,top,width,height,transform,opacity;
  filter:drop-shadow(0 13px 19px rgba(92,64,164,.28));
}

.final-hourglass-stage.is-entering {
  transition:
    left .95s cubic-bezier(.20,.78,.24,1),
    top .95s cubic-bezier(.20,.78,.24,1),
    width .95s cubic-bezier(.20,.78,.24,1),
    height .95s cubic-bezier(.20,.78,.24,1);
}

.final-hourglass-stage svg {
  width:100%;
  height:100%;
  overflow:visible;
  display:block;
}

.final-crack {
  fill:none;
  stroke:#fff;
  stroke-width:1.45;
  stroke-linecap:round;
  stroke-linejoin:round;
  opacity:0;
  pathLength:1;
  stroke-dasharray:1;
  stroke-dashoffset:1;
  filter:drop-shadow(0 0 1px rgba(58,40,111,.76));
  transition:
    stroke-dashoffset .24s ease,
    opacity .12s ease;
}

.final-crack.is-on {
  opacity:.98;
  stroke-dashoffset:0;
}

.final-count-number {
  position:absolute;
  z-index:6;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.68);
  font-size:clamp(96px,18vw,190px);
  line-height:1;
  font-weight:950;
  color:#fff;
  opacity:0;
  text-shadow:
    0 7px 25px rgba(91,62,172,.36),
    0 0 2px rgba(134,84,231,.25);
  font-variant-numeric:tabular-nums;
}

.final-count-number.is-pop {
  animation:finalNumberPop .86s cubic-bezier(.18,.78,.18,1) both;
}

.final-flash {
  position:absolute;
  z-index:8;
  left:50%;
  top:50%;
  width:24px;
  height:24px;
  transform:translate(-50%,-50%) scale(.1);
  border-radius:50%;
  opacity:0;
  background:
    radial-gradient(
      circle,
      #fff 0%,
      #fff4a9 20%,
      #ff9edc 44%,
      rgba(133,84,231,.46) 65%,
      transparent 73%
    );
}

.final-flash.is-go {
  animation:finalFlash .72s ease-out both;
}

.final-hourglass-stage.is-exploding {
  animation:finalGlassExplode .36s ease-out forwards;
}

.final-confetti,
.final-shard {
  position:absolute;
  z-index:7;
  left:50%;
  top:50%;
  pointer-events:none;
  opacity:0;
}

.final-confetti {
  width:9px;
  height:16px;
  border-radius:2px;
}

.final-confetti.is-go {
  animation:
    finalConfetti var(--dur,2s)
    cubic-bezier(.14,.64,.28,1)
    forwards;
}

.final-shard {
  width:18px;
  height:25px;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(111,78,189,.28);
  clip-path:polygon(50% 0,100% 100%,0 76%);
}

.final-shard.is-go {
  animation:finalShard .78s ease-out forwards;
}

.final-gif {
  position:absolute;
  z-index:5;
  left:50%;
  top:50%;
  width:clamp(170px,24vw,300px);
  height:auto;
  transform:translate(-50%,-50%) scale(.65);
  transform-origin:center;
  opacity:0;
  will-change:transform,opacity;
  filter:drop-shadow(0 14px 20px rgba(34,42,63,.24));
}

.final-gif.is-visible {
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
  transition:
    opacity .45s ease,
    transform .7s cubic-bezier(.2,.8,.2,1);
}

.final-gif.is-roaming {
  transition:none;
}

@keyframes finalNumberPop {
  0% {
    opacity:0;
    transform:translate(-50%,-50%) scale(.60);
  }
  22% {
    opacity:1;
    transform:translate(-50%,-50%) scale(1.08);
  }
  67% {
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  100% {
    opacity:0;
    transform:translate(-50%,-50%) scale(.90);
  }
}

@keyframes finalFlash {
  0% {
    opacity:0;
    transform:translate(-50%,-50%) scale(.15);
  }
  18% {
    opacity:1;
  }
  100% {
    opacity:0;
    transform:translate(-50%,-50%) scale(19);
  }
}

@keyframes finalGlassExplode {
  0% {
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  34% {
    opacity:1;
    transform:translate(-50%,-50%) scale(1.12);
  }
  100% {
    opacity:0;
    transform:translate(-50%,-50%) scale(.52);
  }
}

@keyframes finalConfetti {
  0% {
    opacity:0;
    transform:
      translate(-50%,-50%)
      rotate(0deg)
      scale(.5);
  }
  7% {
    opacity:1;
  }
  70% {
    opacity:1;
  }
  100% {
    opacity:0;
    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy) + 115px)
      )
      rotate(var(--rot))
      scale(1);
  }
}

@keyframes finalShard {
  0% {
    opacity:.95;
    transform:
      translate(-50%,-50%)
      rotate(0deg)
      scale(.55);
  }
  100% {
    opacity:0;
    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      rotate(var(--rot))
      scale(1.1);
  }
}

@media(max-width:760px) {
  .final-gif {
    width:clamp(150px,46vw,230px);
  }
}

@media(prefers-reduced-motion:reduce) {
  .final-hourglass-stage.is-entering {
    transition-duration:.01ms;
  }

  .final-count-number.is-pop,
  .final-flash.is-go,
  .final-hourglass-stage.is-exploding,
  .final-confetti.is-go,
  .final-shard.is-go {
    animation-duration:.01ms!important;
  }
}

/* ---------------------------------------------------------
   SVG -> ekran similarity transform
   --------------------------------------------------------- */
function calculateArtworkTransform() {
  /*
    EXACT SVG ENDPOINT MAPPING

    sise-alt başlangıcı       : (25,165)  -> SAW
    sise-ust-ve-akis bitişi  : (939,375) -> ERZ

    Arada ekstra bağlantı çizgisi YOK.
    SVG yalnızca uniform scale + rotation + translation ile oturtulur.
  */
  const leftTarget =
    map.latLngToLayerPoint(SAW);

  const rightTarget =
    map.latLngToLayerPoint(ERZ);

  const sx =
    SVG_SOURCE_RIGHT.x - SVG_SOURCE_LEFT.x;

  const sy =
    SVG_SOURCE_RIGHT.y - SVG_SOURCE_LEFT.y;

  const tx =
    rightTarget.x - leftTarget.x;

  const ty =
    rightTarget.y - leftTarget.y;

  const sourceLengthSquared =
    sx*sx + sy*sy;

  const a =
    (tx*sx + ty*sy) /
    sourceLengthSquared;

  const b =
    (ty*sx - tx*sy) /
    sourceLengthSquared;

  const c = -b;
  const d = a;

  const e =
    leftTarget.x -
    a*SVG_SOURCE_LEFT.x -
    c*SVG_SOURCE_LEFT.y;

  const f =
    leftTarget.y -
    b*SVG_SOURCE_LEFT.x -
    d*SVG_SOURCE_LEFT.y;

  return {a,b,c,d,e,f};
}

function transformSourcePoint(point) {
  const t = routeTransform;

  return L.point(
    t.a*point[0] +
    t.c*point[1] +
    t.e,

    t.b*point[0] +
    t.d*point[1] +
    t.f
  );
}

function rebuildRouteDistances() {
  ROUTE_DISTANCE = [0];

  for(let i=1;i<ROUTE.length;i++) {
    const a = ROUTE[i-1];
    const b = ROUTE[i];

    const latScale =
      Math.cos(
        ((a.lat+b.lat)*.5) *
        Math.PI/180
      );

    const dy =
      (b.lat-a.lat) * 111.32;

    const dx =
      (b.lng-a.lng) *
      111.32 *
      latScale;

    ROUTE_DISTANCE[i] =
      ROUTE_DISTANCE[i-1] +
      Math.hypot(dx,dy);
  }

  ROUTE_TOTAL_DISTANCE =
    ROUTE_DISTANCE[
      ROUTE_DISTANCE.length-1
    ] || 1;
}

function updateRouteArtwork() {
  const size = map.getSize();

  routeArtSvg.setAttribute(
    "viewBox",
    `0 0 ${size.x} ${size.y}`
  );

  routeArtSvg.setAttribute(
    "width",
    String(size.x)
  );

  routeArtSvg.setAttribute(
    "height",
    String(size.y)
  );

  routeArtSvg.style.width =
    `${size.x}px`;

  routeArtSvg.style.height =
    `${size.y}px`;

  routeTransform =
    calculateArtworkTransform();

  routeArtTransform.setAttribute(
    "transform",
    `matrix(
      ${routeTransform.a}
      ${routeTransform.b}
      ${routeTransform.c}
      ${routeTransform.d}
      ${routeTransform.e}
      ${routeTransform.f}
    )`
  );

  /*
    Kalp pin için görünmez motion guide yalnızca SVG'nin kendi
    koordinatlarından türetilir.

    Başlangıç ve bitiş tam olarak:
      ERZ <-> SVG right endpoint
      SAW <-> SVG left endpoint

    Görsel ekstra bağlantı yoktur.
  */
  ROUTE =
    MOTION_SOURCE_POINTS.map(point => {
      const screenPoint =
        transformSourcePoint(point);

      return map.layerPointToLatLng(
        screenPoint
      );
    });

  ROUTE[0] =
    L.latLng(ERZ[0],ERZ[1]);

  ROUTE[ROUTE.length-1] =
    L.latLng(SAW[0],SAW[1]);

  rebuildRouteDistances();
}

function artworkLatLngBounds() {
  if(!routeTransform) {
    return L.latLngBounds([ERC,ERZ,SAW]);
  }

  /*
    Yüklenen SVG'nin gerçek viewBox'u: 0 0 962 529.
    Dört köşeyi exact transform ile harita koordinatına çevir.
  */
  const corners = [
    [0,0],
    [962,0],
    [962,529],
    [0,529]
  ].map(point =>
    map.layerPointToLatLng(
      transformSourcePoint(point)
    )
  );

  corners.push(
    L.latLng(ERC[0],ERC[1]),
    L.latLng(ERZ[0],ERZ[1]),
    L.latLng(SAW[0],SAW[1])
  );

  return L.latLngBounds(corners);
}

/*
  Yalnızca otomatik açılış kadrajına uygulanır.
  Gönderdiğin örnekteki görünüm: fitBounds sonrası +0.5 yakınlaşma.
*/
const INITIAL_ZOOM_BONUS = 0.5;

/*
  Dashboard üstte, durum etiketi altta yer kapladığı için yalnızca
  SVG'nin gerçek çizim sınırını bu iki öğe arasındaki görünür alana
  dikey olarak ortalıyoruz.

  Yatay merkezi ve zoom oranını değiştirmez.
*/
function centerArtworkVertically() {
  const mapRect =
    map.getContainer().getBoundingClientRect();

  const dashboard =
    document.querySelector(".dashboard");

  const status =
    document.getElementById("mapStatus");

  if(!dashboard || !status || !routeArtTransform) {
    return;
  }

  const dashboardRect =
    dashboard.getBoundingClientRect();

  const statusRect =
    status.getBoundingClientRect();

  const visibleTop =
    Math.max(
      0,
      dashboardRect.bottom - mapRect.top + 12
    );

  const visibleBottom =
    Math.min(
      mapRect.height,
      statusRect.top - mapRect.top - 12
    );

  if(visibleBottom <= visibleTop + 30) {
    return;
  }

  const targetCenterY =
    (visibleTop + visibleBottom) / 2;

  let bounds;

  try {
    bounds =
      routeArtTransform.getBBox();
  }
  catch(error) {
    return;
  }

  if(
    !bounds ||
    !Number.isFinite(bounds.x) ||
    !Number.isFinite(bounds.y) ||
    !Number.isFinite(bounds.width) ||
    !Number.isFinite(bounds.height) ||
    bounds.width <= 0 ||
    bounds.height <= 0
  ) {
    return;
  }

  const sourceCorners = [
    [bounds.x, bounds.y],
    [bounds.x + bounds.width, bounds.y],
    [bounds.x, bounds.y + bounds.height],
    [bounds.x + bounds.width, bounds.y + bounds.height]
  ];

  const ys =
    sourceCorners.map(point =>
      map.layerPointToContainerPoint(
        transformSourcePoint(point)
      ).y
    );

  const artworkCenterY =
    (Math.min(...ys) + Math.max(...ys)) / 2;

  const dy =
    artworkCenterY - targetCenterY;

  if(Math.abs(dy) > 0.5) {
    map.panBy(
      [0,dy],
      {animate:false}
    );

    updateRouteArtwork();
  }
}

function fitWholeRoute() {
  updateRouteArtwork();

  map.fitBounds(
    artworkLatLngBounds(),
    {
      paddingTopLeft:[90,230],
      paddingBottomRight:[90,80],
      animate:false
    }
  );

  /*
    Fit edilen görünümden yarım zoom daha yaklaş.
  */
  map.setZoom(
    map.getZoom() + INITIAL_ZOOM_BONUS,
    {animate:false}
  );

  /*
    Yeni zoom'a göre route'u tekrar hizala ve çizimi
    dashboard/status arasındaki görünür alanda ortala.
  */
  updateRouteArtwork();
  centerArtworkVertically();
}

fitWholeRoute();

function pad(n) {
  return String(n).padStart(2,"0");
}

/* =========================================================
   GERİ SAYIM
   ========================================================= */
function updateCountdown(now) {
  let remain = Math.max(0, ARRIVAL_MS - now);

  const DAY = 86400000;
  const HOUR = 3600000;
  const MINUTE = 60000;

  const days = Math.floor(remain / DAY);
  remain %= DAY;

  const hours = Math.floor(remain / HOUR);
  remain %= HOUR;

  const minutes = Math.floor(remain / MINUTE);
  remain %= MINUTE;

  const seconds = Math.floor(remain / 1000);

  document.getElementById("days").textContent =
    String(days).padStart(2,"0");

  document.getElementById("hours").textContent =
    pad(hours);

  document.getElementById("minutes").textContent =
    pad(minutes);

  document.getElementById("seconds").textContent =
    pad(seconds);
}

/* =========================================================
   ROTA / PIN İLERLEMESİ
   ========================================================= */
function routeState(progress) {
  const p = Math.max(0,Math.min(1,progress));

  if(!ROUTE.length) {
    return {
      point:L.latLng(ERZ[0],ERZ[1]),
      passed:[ERZ]
    };
  }

  if(p <= 0) {
    return {
      point:L.latLng(ERZ[0],ERZ[1]),
      passed:[ERZ]
    };
  }

  if(p >= 1) {
    return {
      point:L.latLng(SAW[0],SAW[1]),
      passed:ROUTE.slice()
    };
  }

  const target =
    ROUTE_TOTAL_DISTANCE * p;

  let hi =
    ROUTE_DISTANCE.findIndex(
      distance => distance >= target
    );

  if(hi < 1) hi = 1;

  const lo = hi - 1;

  const startDistance =
    ROUTE_DISTANCE[lo];

  const endDistance =
    ROUTE_DISTANCE[hi];

  const segmentProgress =
    (target - startDistance) /
    Math.max(.000001,endDistance-startDistance);

  const a = ROUTE[lo];
  const b = ROUTE[hi];

  const point = L.latLng(
    a.lat + (b.lat-a.lat) * segmentProgress,
    a.lng + (b.lng-a.lng) * segmentProgress
  );

  const passed =
    ROUTE.slice(0,hi);

  passed.push(point);

  return {
    point,
    passed
  };
}

function updateHourglass(progress) {
  const p = Math.max(0, Math.min(1, progress));

  const topSand = document.getElementById("topSand");
  const bottomSand = document.getElementById("bottomSand");

  const grains = [
    document.getElementById("grain1"),
    document.getElementById("grain2"),
    document.getElementById("grain3")
  ];

  const TOP_MAX_H = 21;
  const topH = TOP_MAX_H * (1 - p);

  topSand.setAttribute("y", 44 - topH);
  topSand.setAttribute("height", Math.max(0, topH));
  topSand.setAttribute("opacity", p >= 1 ? "0" : "1");

  const BOTTOM_MAX_H = 31;
  const bottomH = BOTTOM_MAX_H * p;

  bottomSand.setAttribute("y", 94 - bottomH);
  bottomSand.setAttribute("height", Math.max(0, bottomH));
  bottomSand.setAttribute("opacity", p <= 0 ? "0" : "1");

  const flowing = p > 0 && p < 1;

  grains.forEach((grain,index) => {
    grain.style.opacity =
      flowing ? String(.78 - index * .12) : "0";
  });
}


/* =========================================================
   SON 10 SANİYE / FİNAL SEQUENCE
   ========================================================= */
const finalSequence =
  document.getElementById("finalSequence");

const finalHourglassStage =
  document.getElementById("finalHourglassStage");

const finalCountNumber =
  document.getElementById("finalCountNumber");

const finalFlash =
  document.getElementById("finalFlash");

const finalGif =
  document.getElementById("finalGif");

const finalTopSand =
  document.getElementById("finalTopSand");

const finalBottomSand =
  document.getElementById("finalBottomSand");

const finalSandStream =
  document.getElementById("finalSandStream");

const finalCracks =
  Array.from(
    document.querySelectorAll(".final-crack")
  );

const mainHourglassWrap =
  document.querySelector(".hourglass-wrap");

const FINAL_COUNTDOWN_MS = 10000;
const FINAL_GIF_HOLD_MS = 10000;

let finalStarted = false;
let finalExploded = false;
let finalGifShown = false;
let finalLastDigit = null;
let finalParticles = [];
let finalExplosionAt = null;

function setMainHourglassVisible(visible) {
  if(!mainHourglassWrap) return;

  mainHourglassWrap.style.opacity =
    visible ? "1" : "0";
}

function clearFinalParticles() {
  finalParticles.forEach(node => node.remove());
  finalParticles = [];
}

function activateFinalSequence() {
  if(finalStarted) return;

  finalStarted = true;

  finalSequence.classList.add("is-active");
  finalSequence.setAttribute("aria-hidden","false");

  /*
    Overlay kum saati, üst paneldeki gerçek kum saatinin
    bulunduğu noktadan başlayıp merkeze gelir.
  */
  const source =
    mainHourglassWrap
      ? mainHourglassWrap.getBoundingClientRect()
      : null;

  if(source) {
    finalHourglassStage.style.left =
      `${source.left + source.width/2}px`;

    finalHourglassStage.style.top =
      `${source.top + source.height/2}px`;

    finalHourglassStage.style.width =
      `${source.width}px`;

    finalHourglassStage.style.height =
      `${source.height}px`;
  }

  finalHourglassStage.classList.add(
    "is-entering"
  );

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      finalHourglassStage.style.left = "50%";
      finalHourglassStage.style.top = "50%";

      const finalWidth =
        Math.min(
          230,
          Math.max(
            178,
            window.innerWidth * .19
          )
        );

      finalHourglassStage.style.width =
        `${finalWidth}px`;

      finalHourglassStage.style.height =
        `${finalWidth * 1.285}px`;

      setMainHourglassVisible(false);
    });
  });
}

function updateFinalSand(remainingMs) {
  const p =
    Math.max(
      0,
      Math.min(
        1,
        1 - remainingMs / FINAL_COUNTDOWN_MS
      )
    );

  /*
    Son 10 saniyede üstte yalnızca kalan son miktar görünür.
  */
  const topMax = 14;
  const topH = topMax * (1-p);

  finalTopSand.setAttribute(
    "y",
    String(59-topH)
  );

  finalTopSand.setAttribute(
    "height",
    String(Math.max(0,topH))
  );

  const bottomBase = 30;
  const extra = 15*p;
  const bottomH = bottomBase + extra;

  finalBottomSand.setAttribute(
    "y",
    String(156-bottomH)
  );

  finalBottomSand.setAttribute(
    "height",
    String(bottomH)
  );

  finalSandStream.setAttribute(
    "opacity",
    remainingMs < 900 ? ".36" : ".9"
  );
}

function updateFinalCracks(remainingSec) {
  finalCracks.forEach(crack => {
    const threshold =
      Number(crack.dataset.at);

    crack.classList.toggle(
      "is-on",
      remainingSec <= threshold
    );
  });
}

function updateFinalShake(now,remainingMs) {
  if(
    window.matchMedia &&
    window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches
  ) {
    return;
  }

  const remainingSec =
    remainingMs / 1000;

  const p =
    Math.max(
      0,
      Math.min(
        1,
        1 - remainingSec/10
      )
    );

  /*
    Sona doğru non-lineer biçimde artan sarsıntı.
    Tek frekans yerine birkaç frekans üst üste bindirilir;
    böylece mekanik sağ-sol titreşim gibi görünmez.
  */
  const intensity =
    Math.pow(p,2.25);

  const amp =
    .25 + intensity * 9.2;

  const rotation =
    .06 + intensity * 2.15;

  const t = now / 1000;

  const x =
    Math.sin(t*(8 + intensity*22)) *
      amp*.58 +
    Math.sin(t*(15 + intensity*31)) *
      amp*.18;

  const y =
    Math.cos(t*(10 + intensity*25)) *
      amp*.24;

  const r =
    Math.sin(t*(9 + intensity*24)) *
      rotation +
    Math.sin(t*(18 + intensity*36)) *
      rotation*.18;

  finalHourglassStage.style.transform =
    `translate(-50%,-50%)
     translate(${x.toFixed(2)}px,${y.toFixed(2)}px)
     rotate(${r.toFixed(2)}deg)`;
}

function showFinalDigit(digit) {
  if(finalLastDigit === digit) return;

  finalLastDigit = digit;

  finalCountNumber.classList.remove(
    "is-pop"
  );

  void finalCountNumber.offsetWidth;

  finalCountNumber.textContent =
    String(digit);

  finalCountNumber.classList.add(
    "is-pop"
  );
}

function spawnFinalExplosion(now) {
  if(finalExploded) return;

  finalExploded = true;
  finalExplosionAt = now;

  finalCountNumber.textContent = "";
  finalCountNumber.classList.remove("is-pop");

  finalHourglassStage.style.transform =
    "translate(-50%,-50%)";

  finalHourglassStage.classList.add(
    "is-exploding"
  );

  finalFlash.classList.remove("is-go");
  void finalFlash.offsetWidth;
  finalFlash.classList.add("is-go");

  const colors = [
    "#8654e7",
    "#d266c5",
    "#59d9f1",
    "#ffd45e",
    "#ff8a6f",
    "#ffffff"
  ];

  for(let i=0;i<64;i++) {
    const piece =
      document.createElement("i");

    piece.className =
      "final-confetti";

    piece.style.background =
      colors[i % colors.length];

    const angle =
      Math.PI * 2 * i / 64 +
      (i%5)*.026;

    const distance =
      95 + (i%10)*16;

    piece.style.setProperty(
      "--dx",
      `${(
        Math.cos(angle)*distance
      ).toFixed(1)}px`
    );

    piece.style.setProperty(
      "--dy",
      `${(
        Math.sin(angle)*distance*.74 -
        34 -
        (i%4)*8
      ).toFixed(1)}px`
    );

    piece.style.setProperty(
      "--rot",
      `${220 + (i*47)%560}deg`
    );

    piece.style.setProperty(
      "--dur",
      `${1.55 + (i%8)*.11}s`
    );

    finalSequence.appendChild(piece);
    finalParticles.push(piece);

    requestAnimationFrame(() => {
      piece.classList.add("is-go");
    });
  }

  for(let i=0;i<18;i++) {
    const shard =
      document.createElement("i");

    shard.className =
      "final-shard";

    const angle =
      Math.PI * 2 * i / 18;

    const distance =
      67 + (i%5)*19;

    shard.style.setProperty(
      "--dx",
      `${(
        Math.cos(angle)*distance
      ).toFixed(1)}px`
    );

    shard.style.setProperty(
      "--dy",
      `${(
        Math.sin(angle)*distance
      ).toFixed(1)}px`
    );

    shard.style.setProperty(
      "--rot",
      `${80+i*49}deg`
    );

    finalSequence.appendChild(shard);
    finalParticles.push(shard);

    requestAnimationFrame(() => {
      shard.classList.add("is-go");
    });
  }

  /*
    Patlamadan biraz sonra GIF tam merkezde görünür.
  */
  window.setTimeout(() => {
    showFinalGif();
  },420);
}

function showFinalGif() {
  if(finalGifShown) return;

  finalGifShown = true;

  finalGif.classList.add("is-visible");
}

function updateGifRoaming(now) {
  if(!finalGifShown) return;

  finalGif.classList.add("is-roaming");

  const gifRect =
    finalGif.getBoundingClientRect();

  const marginX = 24;
  const marginY = 28;

  const maxX =
    Math.max(
      0,
      window.innerWidth/2 -
      gifRect.width/2 -
      marginX
    );

  const maxY =
    Math.max(
      0,
      window.innerHeight/2 -
      gifRect.height/2 -
      marginY
    );

  const t =
    (now - (
      finalExplosionAt ||
      ARRIVAL_MS
    )) / 1000;

  /*
    İki sinüs frekansını birleştirerek daha organik,
    sürekli ve köşesiz bir dolaşma.
  */
  const x =
    Math.sin(t*.58)*maxX*.72 +
    Math.sin(t*1.07+.8)*maxX*.16;

  const y =
    Math.sin(t*.43+1.15)*maxY*.68 +
    Math.cos(t*.91)*maxY*.15;

  finalGif.style.transform =
    `translate(-50%,-50%)
     translate(${x.toFixed(1)}px,${y.toFixed(1)}px)
     scale(1)`;
}

function showPostArrivalState(now) {
  activateFinalSequence();

  setMainHourglassVisible(false);

  finalHourglassStage.style.opacity = "0";
  finalHourglassStage.style.pointerEvents = "none";

  const sinceArrival =
    now - ARRIVAL_MS;

  /*
    Sayfa varıştan sonra açılırsa patlamayı zorla tekrar oynatmıyoruz.
    İlk 10 saniye içindeyse GIF merkezde; sonrasında direkt dolaşır.
  */
  showFinalGif();

  if(sinceArrival >= FINAL_GIF_HOLD_MS) {
    updateGifRoaming(now);
  }
}

function updateFinalSequence(now) {
  const remaining =
    ARRIVAL_MS - now;

  /*
    Varıştan 10 saniye önce finale gir.
  */
  if(
    remaining > 0 &&
    remaining <= FINAL_COUNTDOWN_MS
  ) {
    activateFinalSequence();

    finalHourglassStage.style.opacity = "1";

    const remainingSec =
      remaining / 1000;

    updateFinalSand(remaining);
    updateFinalCracks(remainingSec);
    updateFinalShake(now,remaining);

    if(remaining <= 5000) {
      showFinalDigit(
        Math.max(
          1,
          Math.ceil(remaining/1000)
        )
      );
    }
    else {
      finalLastDigit = null;
      finalCountNumber.textContent = "";
      finalCountNumber.classList.remove(
        "is-pop"
      );
    }

    return;
  }

  /*
    Sıfır anı.
  */
  if(
    remaining <= 0 &&
    !finalExploded &&
    now - ARRIVAL_MS < 1100
  ) {
    activateFinalSequence();
    spawnFinalExplosion(now);
    return;
  }

  /*
    Varış sonrası:
    GIF ilk 10 saniye merkezde, sonra smooth dolaşır.
  */
  if(remaining <= 0) {
    if(finalExploded) {
      if(!finalGifShown) {
        showFinalGif();
      }

      const elapsedAfterExplosion =
        now - (
          finalExplosionAt ||
          ARRIVAL_MS
        );

      if(
        elapsedAfterExplosion >=
        FINAL_GIF_HOLD_MS
      ) {
        updateGifRoaming(now);
      }
      else {
        finalGif.classList.remove(
          "is-roaming"
        );

        finalGif.style.transform =
          "translate(-50%,-50%) scale(1)";
      }
    }
    else {
      showPostArrivalState(now);
    }
  }
}


/* =========================================================
   ANA LOOP
   ========================================================= */
let lastSecond = -1;

function frame() {
  const now = Date.now();
  const secondKey = Math.floor(now / 1000);

  if(secondKey !== lastSecond) {
    lastSecond = secondKey;

    updateCountdown(now);
  }

  /*
    İKİ AYRI İLERLEME:

    1) routeProgress
       Sadece gerçek uçuş boyunca ilerler:
       16 Ekim 09:35 → 11:45

    2) hourglassProgress
       16 Ekim 06:00 → 11:45 arasında ilerler
  */
  let routeProgress = 0;
  let hourglassProgress = 0;

  const status = document.getElementById("mapStatus");

  /* ROTA / PIN — sadece uçuş sırasında */
  if(now < DEPARTURE_MS) {
    routeProgress = 0;
  }
  else if(now < ARRIVAL_MS) {
    routeProgress =
      (now - DEPARTURE_MS) / FLIGHT_MS;
  }
  else {
    routeProgress = 1;
  }

  /* KUM SAATİ — 06:00 → 11:45 */
  if(now < COUNTDOWN_PROGRESS_START_MS) {
    hourglassProgress = 0;
  }
  else if(now < ARRIVAL_MS) {
    hourglassProgress =
      (now - COUNTDOWN_PROGRESS_START_MS) /
      COUNTDOWN_PROGRESS_MS;
  }
  else {
    hourglassProgress = 1;
  }

  /* Durum yazısı */
  if(now < DEPARTURE_MS) {
    status.innerHTML =
      "<strong>Hazır.</strong> Kalkış 16 Ekim 09:35.";
  }
  else if(now < ARRIVAL_MS) {
    status.innerHTML =
      "<strong>Uçuşta.</strong> EzgiŞ Sabiha Gökçen’e doğru ilerliyor.";
  }
  else {
    status.innerHTML =
      "<strong>EzgiŞ geldi.</strong> Sabiha Gökçen’e ulaştı.";
  }

  const state = routeState(routeProgress);

  marker.setLatLng(state.point);

  /*
    Kalbin arkasında kalan uçuş bölümünün üç sihir katmanı
    aynı geometriyi takip eder.
  */
  traveledGlow.setLatLngs(state.passed);
  traveled.setLatLngs(state.passed);
  traveledSpark.setLatLngs(state.passed);

  updateHourglass(hourglassProgress);

  updateFinalSequence(now);

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

setTimeout(() => {
  map.invalidateSize();
  fitWholeRoute();
},120);

/*
  SVG routeArtPane içinde olduğu için pan/zoom sırasında Leaflet ile
  birlikte doğal olarak hareket eder. İşlem bittikten sonra endpoint
  transformunu bir kez kesin olarak yeniden hesaplarız.
*/
map.on("moveend zoomend resize",() => {
  requestAnimationFrame(() => {
    updateRouteArtwork();
  });
});

window.addEventListener("resize",() => {
  map.invalidateSize();

  requestAnimationFrame(() => {
    updateRouteArtwork();
    centerArtworkVertically();
  });
});
</script>
