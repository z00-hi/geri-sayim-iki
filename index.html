<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf2f8">
<title>EzgiŞ geliyor ✈️</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  crossorigin=""
>

<style>
:root {
  --panel-a:#d7eef9;
  --panel-b:#e9e5fb;
  --panel-c:#f6e4ee;
  --panel-d:#ffe7d9;

  --ink:#18263f;
  --muted:#6e7c93;

  --purple:#8654e7;
  --violet:#a45de1;
  --pink:#d266c5;
  --coral:#ff8a6f;
  --cyan:#59d9f1;
  --gold:#ffd45e;

  --route:#25c65a;
  --passed:#8f52ea;

  --panel-shadow:0 8px 28px rgba(31,51,84,.15);
}

* {
  box-sizing:border-box;
}

html,
body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body {
  position:relative;
  font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:#edf3f8;
  -webkit-font-smoothing:antialiased;
}

button,
input,
select,
textarea {
  font:inherit;
}

/* =========================================================
   ÜST PANEL
   ========================================================= */
.dashboard {
  position:fixed;
  z-index:1000;
  top:0;
  left:0;
  right:0;
  width:100%;
  background:
    linear-gradient(
      105deg,
      rgba(215,238,249,.94) 0%,
      rgba(233,229,251,.94) 42%,
      rgba(246,228,238,.94) 72%,
      rgba(255,231,217,.94) 100%
    );
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(24,52,95,.08);
  box-shadow:0 7px 22px rgba(31,51,84,.11);
}

.dashboard-inner {
  width:min(1120px,100%);
  margin:0 auto;
  display:grid;
  grid-template-columns:164px minmax(0,1fr);
  gap:18px;
  align-items:stretch;
  padding:7px 22px 9px;
}

.hourglass-zone {
  min-height:154px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.content-zone {
  position:relative;
  min-width:0;
  display:grid;
  grid-template-rows:auto auto;
  align-content:center;
  row-gap:12px;
  overflow:hidden;
  isolation:isolate;
  padding-left:18px;
}

.content-zone::before {
  content:"✈️";
  position:absolute;
  z-index:0;
  left:51%;
  top:50%;
  transform:translate(-50%,-50%) rotate(-10deg);
  font-size:clamp(235px,23vw,330px);
  line-height:1;
  opacity:.034;
  filter:grayscale(.2) saturate(.75);
  pointer-events:none;
  user-select:none;
}

.content-zone > * {
  position:relative;
  z-index:1;
}


.dashboard-head {
  width:100%;
  margin:0;
  display:block;
  padding:0;
}

/* =========================================================
   TEK ANALOG SAAT
   ========================================================= */
.clock-wrap {
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:11px;
  min-width:0;
  justify-self:end;
}

.analog-clock {
  width:72px;
  height:72px;
  flex:0 0 72px;
  position:relative;
  border-radius:50%;
  background:
    linear-gradient(
      135deg,
      #7d4dff 0%,
      #5ddcff 34%,
      #ff72cd 68%,
      #ffd55d 100%
    );
  filter:drop-shadow(0 5px 9px rgba(24,41,72,.16));
}

.analog-clock::after {
  content:"";
  position:absolute;
  inset:6px;
  border-radius:50%;
  background:#fff;
  box-shadow:
    inset 0 0 0 1px rgba(23,52,95,.07),
    inset 0 0 10px rgba(43,66,104,.035);
}

.clock-face {
  position:absolute;
  z-index:10;
  inset:9px;
  border-radius:50%;
  pointer-events:none;
}

.tick {
  position:absolute;
  left:50%;
  top:50%;
  width:1.6px;
  height:4.5px;
  margin-left:-.8px;
  margin-top:-25px;
  transform-origin:.8px 25px;
  background:#8492a8;
  border-radius:99px;
  opacity:.65;
}

.tick.major {
  width:2.6px;
  height:7px;
  margin-left:-1.3px;
  transform-origin:1.3px 25px;
  background:#334864;
  opacity:.9;
}

.hand {
  position:absolute;
  z-index:20;
  left:50%;
  top:50%;
  transform-origin:2px 50%;
  border-radius:99px;
}

.hand.hour {
  width:14px;
  height:3.6px;
  margin-left:-2px;
  margin-top:-2px;
  background:#273a58;
}

.hand.minute {
  width:19px;
  height:2.7px;
  margin-left:-2px;
  margin-top:-1.5px;
  background:#405a7f;
}

.hand.second {
  width:18px;
  height:1.3px;
  margin-left:-2px;
  margin-top:-.75px;
  background:#d94f6a;
}

.clock-pin {
  position:absolute;
  z-index:30;
  left:50%;
  top:50%;
  width:5px;
  height:5px;
  margin:-2.5px 0 0 -2.5px;
  border-radius:50%;
  background:#fff;
  border:1.4px solid #334864;
}

.clock-caption {
  min-width:0;
  text-align:right;
}

.clock-caption .small {
  font-size:11px;
  line-height:1.15;
  font-weight:900;
  letter-spacing:.65px;
  color:#243854;
  white-space:nowrap;
}

.clock-caption .time {
  margin-top:5px;
  font-size:27px;
  line-height:1.08;
  font-weight:950;
  color:#111;
  letter-spacing:-.4px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

/* =========================================================
   BAŞLIK
   ========================================================= */
.title-stack {
  min-width:0;
  width:auto;
  max-width:100%;
  min-height:0;
  margin:0;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  text-align:left;
  overflow:visible;
  background:transparent;
  border:none;
  box-shadow:none;
}

.title {
  display:inline-block;
  margin:0;
  padding:.08em 0 .20em;
  overflow:visible;
  font-size:clamp(36px,4vw,50px);
  line-height:1.16;
  font-weight:950;
  letter-spacing:.1px;
  white-space:nowrap;
  background:linear-gradient(90deg,#7448e8 0%,#b85bd5 52%,#ef72a8 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
}


/* =========================================================
   GERİ SAYIM
   ========================================================= */
.countdown-row {
  width:100%;
  margin:0;
  display:block;
  padding:0;
}

.hourglass-wrap {
  position:relative;
  width:140px;
  height:146px;
  display:grid;
  place-items:center;
}

.hourglass-aura {
  position:absolute;
  width:118px;
  height:118px;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.98) 0%,
      rgba(255,205,245,.62) 28%,
      rgba(130,206,255,.30) 52%,
      rgba(147,93,237,.12) 68%,
      transparent 74%
    );
  animation:auraPulse 2.2s ease-in-out infinite;
}

.sparkles {
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
}

.sparkles span {
  position:absolute;
  color:#fff;
  text-shadow:
    0 0 5px #fff,
    0 0 12px #b778ff,
    0 0 18px #5edbff;
  animation:twinkle 1.7s ease-in-out infinite;
}

.sparkles span:nth-child(1) { left:1px; top:7px; font-size:15px; animation-delay:.1s; }
.sparkles span:nth-child(2) { right:2px; top:18px; font-size:12px; animation-delay:.5s; }
.sparkles span:nth-child(3) { left:5px; bottom:10px; font-size:11px; animation-delay:.9s; }
.sparkles span:nth-child(4) { right:5px; bottom:3px; font-size:15px; animation-delay:1.2s; }

@keyframes auraPulse {
  0%,100% { transform:scale(.92); opacity:.7; }
  50% { transform:scale(1.08); opacity:1; }
}

@keyframes twinkle {
  0%,100% { transform:scale(.65) rotate(0deg); opacity:.3; }
  50% { transform:scale(1.22) rotate(20deg); opacity:1; }
}

.hourglass {
  position:relative;
  z-index:2;
  width:112px;
  height:134px;
  filter:drop-shadow(0 7px 10px rgba(94,63,164,.24));
}

#topSand,
#bottomSand {
  transition:
    y .8s linear,
    height .8s linear,
    opacity .4s ease;
}

.sand-stream,
.grain {
  transition:opacity .35s ease;
}

.countdown-content {
  min-width:0;
  width:100%;
}


.count-grid {
  width:auto;
  display:grid;
  grid-template-columns:repeat(4,132px);
  justify-content:start;
  gap:14px;
}

.count-unit {
  background:rgba(255,255,255,.90);
  border:1px solid rgba(255,255,255,.66);
  border-radius:16px;
  padding:10px 7px 9px;
  text-align:center;
  box-shadow:0 4px 12px rgba(30,50,84,.055);
}

.count-value {
  font-size:27px;
  line-height:1;
  font-weight:900;
  color:#111;
  letter-spacing:-1px;
  font-variant-numeric:tabular-nums;
}

.count-label {
  margin-top:5px;
  font-size:10px;
  font-weight:750;
  color:#63718a;
}

/* =========================================================
   HARİTA
   ========================================================= */
#map {
  position:fixed;
  z-index:1;
  inset:0;
  width:100%;
  height:100%;
  background:#e9eff4;
}

.leaflet-control-attribution {
  font-size:8px!important;
  color:#66748a!important;
  background:rgba(255,255,255,.82)!important;
}

.route-tip {
  border:0!important;
  border-radius:9px!important;
  padding:5px 8px!important;
  background:rgba(255,255,255,.96)!important;
  box-shadow:0 5px 15px rgba(27,39,65,.15)!important;
  color:#263750!important;
  font-size:11px!important;
  font-weight:800!important;
}

.route-tip::before {
  display:none!important;
}

.custom-pin {
  background:transparent!important;
  border:0!important;
}

.pin-svg {
  overflow:visible;
  filter:drop-shadow(0 8px 12px rgba(57,36,99,.25));
}

.pin-pulse {
  transform-box:fill-box;
  transform-origin:center;
  animation:pinPulse 2s ease-out infinite;
}

@keyframes pinPulse {
  0% { opacity:.68; transform:scale(.92); }
  70% { opacity:0; transform:scale(1.16); }
  100% { opacity:0; transform:scale(1.16); }
}

.map-status {
  position:absolute;
  z-index:700;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  max-width:calc(100% - 40px);
  padding:8px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.92);
  border:1px solid rgba(24,52,95,.08);
  box-shadow:0 7px 22px rgba(30,50,85,.14);
  backdrop-filter:blur(9px);
  color:#536176;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.map-status strong {
  color:var(--purple);
}

/* =========================================================
   MOBİL
   ========================================================= */

  }

  }

  .count-value {

  }

  .count-label {

  }

  .route-tip {
    font-size:9px!important;

  }

  .dashboard-head {
    grid-template-columns:minmax(0,1fr) auto;

  }

  }

@media(prefers-reduced-motion:reduce) {
  *,
  *::before,
  *::after {
    animation-duration:.001ms!important;
    transition-duration:.001ms!important;
  }
}

</head>

<body>

<section class="dashboard">
  <div class="dashboard-inner">

    <div class="hourglass-zone">
      <div class="hourglass-wrap">
        <div class="hourglass-aura"></div>

        <div class="sparkles" aria-hidden="true">
          <span>✦</span>
          <span>✧</span>
          <span>✦</span>
          <span>✧</span>
        </div>

        <svg class="hourglass" viewBox="0 0 90 110" aria-hidden="true">
          <defs>
            <linearGradient id="hgFrame" x1="0" y1="0" x2="1" y2="1">

  className:"custom-pin",
  html:pinHtml,
  iconSize:[94,94],
  iconAnchor:[47,91]

  ERC,
  {
    icon:movingIcon,
    zIndexOffset:1000

).addTo(map);

function fitWholeRoute() {
  map.fitBounds(routeLine.getBounds(), {
    paddingTopLeft:[95,190],
    paddingBottomRight:[95,70],
    animate:false
  });
}

fitWholeRoute();

function pad(n) {
  return String(n).padStart(2,"0");
}

/* =========================================================
   GERİ SAYIM
   ========================================================= */
function updateCountdown(now) {
  let remain = Math.max(0, ARRIVAL_MS - now);

  const DAY = 86400000;
  const HOUR = 3600000;
  const MINUTE = 60000;

  const days = Math.floor(remain / DAY);
  remain %= DAY;

  const hours = Math.floor(remain / HOUR);
  remain %= HOUR;

  const minutes = Math.floor(remain / MINUTE);
  remain %= MINUTE;

  const seconds = Math.floor(remain / 1000);

  document.getElementById("days").textContent =
    String(days).padStart(2,"0");

  document.getElementById("hours").textContent =
    pad(hours);

  document.getElementById("minutes").textContent =
    pad(minutes);

  document.getElementById("seconds").textContent =
    pad(seconds);
}

/* =========================================================
   ROTA / PIN İLERLEMESİ
   ========================================================= */
function routeState(progress) {
  const p = Math.max(0, Math.min(1, progress));

  if(p <= 0) {
    return {
      point:ERC,
      passed:[ERC]
    };
  }

  if(p >= 1) {
    return {
      point:SAW,
      passed:ROUTE.slice()
    };
  }

  const target =
    ROUTE_TOTAL_DISTANCE * p;

  let hi = ROUTE_DISTANCE.findIndex(
    distance => distance >= target
  );

  if(hi < 1) hi = 1;

  const lo = hi - 1;

  const aDistance = ROUTE_DISTANCE[lo];
  const bDistance = ROUTE_DISTANCE[hi];

  const segmentProgress =
    (target - aDistance) /
    Math.max(.000001, bDistance - aDistance);

  const a = ROUTE[lo];
  const b = ROUTE[hi];

  const point = [
    a[0] + (b[0] - a[0]) * segmentProgress,
    a[1] + (b[1] - a[1]) * segmentProgress
  ];

  const passed = ROUTE.slice(0,hi);
  passed.push(point);

  return {
    point,
    passed
  };
}

function updateHourglass(progress) {
  const p = Math.max(0, Math.min(1, progress));

  const topSand = document.getElementById("topSand");
  const bottomSand = document.getElementById("bottomSand");
  const stream = document.querySelector(".sand-stream");

  const grains = [
    document.getElementById("grain1"),
    document.getElementById("grain2"),
    document.getElementById("grain3")
  ];

  const TOP_MAX_H = 21;
  const topH = TOP_MAX_H * (1 - p);

  topSand.setAttribute("y", 44 - topH);
  topSand.setAttribute("height", Math.max(0, topH));
  topSand.setAttribute("opacity", p >= 1 ? "0" : "1");

  const BOTTOM_MAX_H = 31;
  const bottomH = BOTTOM_MAX_H * p;

  bottomSand.setAttribute("y", 94 - bottomH);
  bottomSand.setAttribute("height", Math.max(0, bottomH));
  bottomSand.setAttribute("opacity", p <= 0 ? "0" : "1");

  const flowing = p > 0 && p < 1;

  stream.style.opacity = flowing ? ".95" : "0";

  grains.forEach((grain,index) => {
    grain.style.opacity =
      flowing ? String(.78 - index * .12) : "0";
  });
}

/* =========================================================
   ANA LOOP
   ========================================================= */
let lastSecond = -1;

function frame() {
  const now = Date.now();
  const secondKey = Math.floor(now / 1000);

  if(secondKey !== lastSecond) {
    lastSecond = secondKey;

    updateCountdown(now);
  }

  let progress = 0;
  const status = document.getElementById("mapStatus");

  if(now < DEPARTURE_MS) {
    progress = 0;
    status.innerHTML =
      "<strong>Hazır.</strong> Kalkış 15 Ekim 17:45.";
  }
  else if(now < ARRIVAL_MS) {
    progress =
      (now - DEPARTURE_MS) / FLIGHT_MS;

    status.innerHTML =
      "<strong>Uçuşta.</strong> EzgiŞ Sabiha Gökçen’e doğru ilerliyor.";
  }
  else {
    progress = 1;

    status.innerHTML =
      "<strong>EzgiŞ geldi.</strong> Sabiha Gökçen’e ulaştı.";
  }

  const state = routeState(progress);

  marker.setLatLng(state.point);
  traveled.setLatLngs(state.passed);

  updateHourglass(progress);

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

setTimeout(() => {
  map.invalidateSize();
  fitWholeRoute();
},120);

window.addEventListener("resize",() => {
  map.invalidateSize();
});
